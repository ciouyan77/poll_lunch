<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>辦公室 3D 投票同樂會</title>
  <style>
    body { margin: 0; overflow: hidden; font-family: sans-serif; }
    #ui-overlay { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; gap: 15px; z-index: 10; }
    button { padding: 12px 24px; font-size: 16px; font-weight: bold; border-radius: 8px; border: none; cursor: pointer; }
    .btn-clap { background: #eab308; color: white; }
    .btn-punch { background: #ef4444; color: white; }
    .btn-vote { background: #3b82f6; color: white; }
    
    #modal { display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: white; padding: 25px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); z-index: 20; min-width: 300px; }
    #login-modal { position: absolute; inset: 0; background: rgba(0,0,0,0.8); display: flex; justify-content: center; align-items: center; z-index: 30; }
    .login-box { background: white; padding: 30px; border-radius: 12px; text-align: center; }
  </style>
  <!-- 引入 Three.js 與 Socket.io CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="/socket.io/socket.io.js"></script>
</head>
<body>

  <!-- 登入視窗 -->
  <div id="login-modal">
    <div class="login-box">
      <h2>進入 3D 會議室</h2>
      <input type="text" id="username" placeholder="輸入你的大名" style="padding:8px; width:80%; margin-bottom:15px;"><br>
      <label><input type="checkbox" id="isHost"> 我是主持人</label><br><br>
      <button class="btn-vote" onclick="startGame()">進入房間</button>
    </div>
  </div>

  <!-- 下方操作按鈕 -->
  <div id="ui-overlay">
    <button class="btn-clap" onclick="triggerClap()">👏 鼓掌</button>
    <button class="btn-punch" onclick="triggerPunch()">🥊 揍人</button>
    <button class="btn-vote" id="vote-action-btn" onclick="openVoteModal()">🗳️ 投票 / 設定</button>
  </div>

  <!-- 投票/主持對話框 -->
  <div id="modal">
    <div id="modal-content"></div>
    <br><button onclick="closeModal()">關閉</button>
  </div>

  <script>
    let socket, scene, camera, renderer;
    let myId, myMesh;
    let otherPlayers = {};
    let isHost = false;
    let currentVoting = null;
    let screenCanvas, screenTexture;

    function startGame() {
      const name = document.getElementById('username').value.trim() || '同事';
      isHost = document.getElementById('isHost').checked;
      document.getElementById('login-modal').style.display = 'none';

      init3D();
      initNetwork(name, isHost);
    }

    function init3D() {
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0xdce5ef);

      camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 8, 14);
      camera.lookAt(0, 0, 0);

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      document.body.appendChild(renderer.domElement);

      const light = new THREE.DirectionalLight(0xffffff, 1);
      light.position.set(5, 15, 5);
      scene.add(light);
      scene.add(new THREE.AmbientLight(0x666666));

      // 地板
      const floor = new THREE.Mesh(new THREE.PlaneGeometry(30, 30), new THREE.MeshLambertMaterial({ color: 0xe2e8f0 }));
      floor.rotation.x = -Math.PI / 2;
      scene.add(floor);

      // 投票桌 (中心圓桌)
      const table = new THREE.Mesh(new THREE.CylinderGeometry(2, 2, 1, 32), new THREE.MeshLambertMaterial({ color: 0x94a3b8 }));
      table.position.set(0, 0.5, 0);
      scene.add(table);

      // 大螢幕看板
      screenCanvas = document.createElement('canvas');
      screenCanvas.width = 1024; screenCanvas.height = 512;
      screenTexture = new THREE.CanvasTexture(screenCanvas);
      const screenMesh = new THREE.Mesh(new THREE.PlaneGeometry(12, 6), new THREE.MeshBasicMaterial({ map: screenTexture }));
      screenMesh.position.set(0, 4.5, -8);
      scene.add(screenMesh);

      // 鍵盤移動監聽
      window.addEventListener('keydown', handleKey);
      animate();
    }

    function renderScreen() {
      if (!currentVoting) return;
      const ctx = screenCanvas.getContext('2d');
      ctx.fillStyle = "#1e293b"; ctx.fillRect(0, 0, 1024, 512);
      ctx.fillStyle = "#38bdf8"; ctx.font = "bold 38px sans-serif";
      ctx.fillText(`【${currentVoting.mode === 'single' ? '單選' : '多選'}】${currentVoting.question}`, 50, 70);

      currentVoting.options.forEach((opt, idx) => {
        const y = 140 + idx * 80;
        ctx.fillStyle = "#334155"; ctx.fillRect(50, y, 900, 50);
        ctx.fillStyle = "#4ade80"; ctx.fillRect(50, y, Math.min(opt.votes * 100, 900), 50);
        ctx.fillStyle = "#ffffff"; ctx.font = "30px sans-serif";
        ctx.fillText(`${opt.text} — ${opt.votes} 票`, 70, y + 36);
      });
      screenTexture.needsUpdate = true;
    }

    function createPlayerMesh(p) {
      const group = new THREE.Group();
      // 膠囊/積木人身體
      const body = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.5, 1.4, 16), new THREE.MeshLambertMaterial({ color: p.color }));
      body.position.y = 0.7;
      group.add(body);
      group.position.set(p.x, 0, p.z);
      scene.add(group);
      return { group, body, origColor: p.color, pos: group.position };
    }

    function initNetwork(name, isHost) {
      socket = io();
      socket.emit('join', { name, isHost });

      socket.on('init', (data) => {
        myId = data.id;
        currentVoting = data.voting;
        renderScreen();

        for (let id in data.players) {
          if (id === myId) {
            myMesh = createPlayerMesh(data.players[id]);
          } else {
            otherPlayers[id] = createPlayerMesh(data.players[id]);
          }
        }
      });

      socket.on('playerJoined', (p) => { otherPlayers[p.id] = createPlayerMesh(p); });
      socket.on('playerMoved', (data) => {
        if (otherPlayers[data.id]) otherPlayers[data.id].group.position.set(data.x, 0, data.z);
      });
      socket.on('playerLeft', (id) => {
        if (otherPlayers[id]) { scene.remove(otherPlayers[id].group); delete otherPlayers[id]; }
      });

      // 拍手跳動動畫
      socket.on('playerClapped', ({ id }) => {
        const p = id === myId ? myMesh : otherPlayers[id];
        if (p) {
          p.group.position.y = 1.2;
          setTimeout(() => p.group.position.y = 0, 200);
        }
      });

      // 受擊紅色打擊效果
      socket.on('playerHit', ({ targetId }) => {
        const p = targetId === myId ? myMesh : otherPlayers[targetId];
        if (p) {
          p.body.material.color.setHex(0xff0000); // 變紅
          p.group.scale.set(1.3, 0.8, 1.3);      // 壓扁反饋
          setTimeout(() => {
            p.body.material.color.setHex(p.origColor);
            p.group.scale.set(1, 1, 1);
          }, 180);
        }
      });

      socket.on('voteUpdated', (v) => {
        currentVoting = v;
        renderScreen();
      });
    }

    function handleKey(e) {
      if (!myMesh) return;
      const speed = 0.5;
      if (e.key === 'w' || e.key === 'ArrowUp') myMesh.pos.z -= speed;
      if (e.key === 's' || e.key === 'ArrowDown') myMesh.pos.z += speed;
      if (e.key === 'a' || e.key === 'ArrowLeft') myMesh.pos.x -= speed;
      if (e.key === 'd' || e.key === 'ArrowRight') myMesh.pos.x += speed;
      socket.emit('move', { x: myMesh.pos.x, z: myMesh.pos.z });
    }

    function triggerClap() { socket.emit('clap'); }

    function triggerPunch() {
      // 尋找 2 米內最近的同事
      let closestId = null, minDist = 2.5;
      for (let id in otherPlayers) {
        let dist = myMesh.pos.distanceTo(otherPlayers[id].pos);
        if (dist < minDist) { minDist = dist; closestId = id; }
      }
      if (closestId) socket.emit('punch', closestId);
    }

    function openVoteModal() {
      const modal = document.getElementById('modal');
      const content = document.getElementById('modal-content');
      modal.style.display = 'block';

      if (isHost) {
        content.innerHTML = `
          <h3>主持人設定投票</h3>
          題目：<input id="v-q" value="${currentVoting.question}" style="width:100%"><br><br>
          類型：
          <select id="v-mode">
            <option value="single" ${currentVoting.mode==='single'?'selected':''}>單選</option>
            <option value="multiple" ${currentVoting.mode==='multiple'?'selected':''}>多選</option>
          </select><br><br>
          選項（逗號分隔）：<br>
          <input id="v-opts" value="${currentVoting.options.map(o=>o.text).join(',')}" style="width:100%"><br><br>
          <button class="btn-vote" onclick="submitHostSettings()">發起/更新投票</button>
        `;
      } else {
        const type = currentVoting.mode === 'single' ? 'radio' : 'checkbox';
        content.innerHTML = `
          <h3>${currentVoting.question}</h3>
          ${currentVoting.options.map(o => `
            <label style="display:block; margin:8px 0;">
              <input type="${type}" name="vote-opt" value="${o.id}"> ${o.text}
            </label>
          `).join('')}
          <button class="btn-vote" onclick="submitUserVote()">送出選票</button>
        `;
      }
    }

    function submitHostSettings() {
      const q = document.getElementById('v-q').value;
      const mode = document.getElementById('v-mode').value;
      const opts = document.getElementById('v-opts').value.split(',').map(s=>s.trim()).filter(Boolean);
      socket.emit('hostSetVote', { question: q, mode, options: opts });
      closeModal();
    }

    function submitUserVote() {
      const checked = Array.from(document.querySelectorAll('input[name="vote-opt"]:checked')).map(i => parseInt(i.value));
      socket.emit('castVote', checked);
      closeModal();
    }

    function closeModal() { document.getElementById('modal').style.display = 'none'; }

    function animate() {
      requestAnimationFrame(animate);
      renderer.render(scene, camera);
    }
  </script>
</body>
</html>
