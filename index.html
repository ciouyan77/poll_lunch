<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>辦公室 3D 投票同樂會</title>
  <style>
    * { box-sizing: border-box; touch-action: manipulation; }
    body { margin: 0; overflow: hidden; font-family: sans-serif; user-select: none; background: #cfd8dc; }

    #joystick-zone {
      position: absolute;
      bottom: 30px;
      left: 30px;
      width: 120px;
      height: 120px;
      background: rgba(255, 255, 255, 0.25);
      border: 2px solid rgba(255, 255, 255, 0.4);
      border-radius: 50%;
      z-index: 15;
      touch-action: none;
    }
    #joystick-knob {
      position: absolute;
      top: 35px;
      left: 35px;
      width: 50px;
      height: 50px;
      background: rgba(255, 255, 255, 0.7);
      border-radius: 50%;
      pointer-events: none;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
    }

    #ui-overlay {
      position: absolute;
      bottom: 25px;
      right: 25px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      z-index: 15;
    }
    @media (min-width: 768px) {
      #ui-overlay {
        flex-direction: row;
        right: auto;
        left: 50%;
        transform: translateX(-50%);
      }
    }

    button {
      padding: 12px 20px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      box-shadow: 0 4px 6px rgba(0,0,0,0.15);
      transition: transform 0.05s;
    }
    button:active { transform: scale(0.92); }
    .btn-clap { background: #eab308; color: white; }
    .btn-punch { background: #ef4444; color: white; }
    .btn-vote { background: #3b82f6; color: white; }

    #modal {
      display: none;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: white;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.3);
      z-index: 25;
      width: 85%;
      max-width: 360px;
      max-height: 80vh;
      overflow-y: auto;
    }
    #login-modal {
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.85);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 30;
    }
    .login-box {
      background: white;
      padding: 28px;
      border-radius: 16px;
      text-align: center;
      width: 80%;
      max-width: 300px;
    }
    .close-btn { background: #64748b; color: white; margin-top: 15px; width: 100%; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="/socket.io/socket.io.js"></script>
</head>
<body>

  <div id="login-modal">
    <div class="login-box">
      <h2>3D 辦公室</h2>
      <input type="text" id="username" placeholder="輸入同事暱稱" style="padding:10px; width:100%; font-size:16px; margin-bottom:15px; border:1px solid #cbd5e1; border-radius:8px;"><br>
      <label style="font-size:15px; cursor:pointer;"><input type="checkbox" id="isHost"> 我是主持人</label><br><br>
      <button class="btn-vote" style="width:100%;" onclick="startGame()">進入房間</button>
    </div>
  </div>

  <div id="joystick-zone">
    <div id="joystick-knob"></div>
  </div>

  <div id="ui-overlay">
    <button class="btn-clap" onclick="triggerClap()">👏 鼓掌</button>
    <button class="btn-punch" onclick="triggerPunch()">🏏 揮棒揍人</button>
    <button class="btn-vote" onclick="openVoteModal()">🗳️ 投票 / 設定</button>
  </div>

  <div id="modal">
    <div id="modal-content"></div>
    <button class="close-btn" onclick="closeModal()">關閉</button>
  </div>

  <script>
    let socket, scene, camera, renderer;
    let myId, myPlayer;
    let players = {};
    let isHost = false;
    let currentVoting = null;
    let screenCanvas, screenTexture;

    let joyMoveX = 0;
    let joyMoveZ = 0;

    function startGame() {
      const name = document.getElementById('username').value.trim() || '同事';
      isHost = document.getElementById('isHost').checked;
      document.getElementById('login-modal').style.display = 'none';

      init3D();
      initJoystick();
      initNetwork(name, isHost);
    }

    function init3D() {
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0xcfd8dc);

      camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 12, 18);
      camera.lookAt(0, 2, 0);

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      document.body.appendChild(renderer.domElement);

      const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
      dirLight.position.set(10, 25, 10);
      scene.add(dirLight);
      scene.add(new THREE.AmbientLight(0x777777));

      const floor = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), new THREE.MeshLambertMaterial({ color: 0xecf0f1 }));
      floor.rotation.x = -Math.PI / 2;
      scene.add(floor);

      const table = new THREE.Mesh(new THREE.CylinderGeometry(2.5, 2.5, 0.8, 32), new THREE.MeshLambertMaterial({ color: 0x90a4ae }));
      table.position.set(0, 0.4, 0);
      scene.add(table);

      screenCanvas = document.createElement('canvas');
      screenCanvas.width = 1024;
      screenCanvas.height = 768;
      screenTexture = new THREE.CanvasTexture(screenCanvas);
      const screenMesh = new THREE.Mesh(new THREE.PlaneGeometry(14, 7.5), new THREE.MeshBasicMaterial({ map: screenTexture }));
      screenMesh.position.set(0, 7.2, -9);
      scene.add(screenMesh);

      window.addEventListener('keydown', handleKey);
      window.addEventListener('resize', onWindowResize);

      animate();
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function createNameSprite(name) {
      const canvas = document.createElement('canvas');
      canvas.width = 256; canvas.height = 64;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = "rgba(0, 0, 0, 0.65)";
      ctx.roundRect ? ctx.roundRect(8, 8, 240, 48, 12) : ctx.fillRect(8, 8, 240, 48);
      ctx.fill();
      ctx.fillStyle = "#ffffff";
      ctx.font = "bold 26px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText(name, 128, 41);

      const texture = new THREE.CanvasTexture(canvas);
      const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: texture }));
      sprite.position.set(0, 2.5, 0);
      sprite.scale.set(3.2, 0.8, 1);
      return sprite;
    }

    function createPlayerMesh(p) {
      const group = new THREE.Group();

      const bodyMat = new THREE.MeshLambertMaterial({ color: p.color });
      const body = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.5, 1.4, 16), bodyMat);
      body.position.y = 0.7;
      group.add(body);

      const handGeo = new THREE.SphereGeometry(0.18, 12, 12);
      const leftHand = new THREE.Mesh(handGeo, bodyMat);
      leftHand.position.set(-0.65, 0.7, 0);
      const rightHand = new THREE.Mesh(handGeo, bodyMat);
      rightHand.position.set(0.65, 0.7, 0);
      group.add(leftHand);
      group.add(rightHand);

      // 右手持充氣棒樞紐 (Pivot)
      const batPivot = new THREE.Group();
      batPivot.position.set(0.65, 0.7, 0);
      
      const handle = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 0.4), new THREE.MeshLambertMaterial({ color: 0xef4444 }));
      handle.position.y = 0.2;
      const batHead = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.15, 0.8, 12), new THREE.MeshLambertMaterial({ color: 0xfacc15 }));
      batHead.position.y = 0.7;
      
      batPivot.add(handle);
      batPivot.add(batHead);
      // 初始稍微往前傾斜
      batPivot.rotation.x = 0.3;
      group.add(batPivot);

      const nameSprite = createNameSprite(p.name);
      group.add(nameSprite);

      group.position.set(p.x, 0, p.z);
      scene.add(group);

      return {
        group, body, leftHand, rightHand, batPivot,
        origColor: p.color,
        name: p.name,
        targetPos: new THREE.Vector3(p.x, 0, p.z)
      };
    }

    // 顯著的揮棒動畫（向下重擊後回彈）
    function playSwingAnimation(playerObj) {
      if (!playerObj || !playerObj.batPivot) return;
      const pivot = playerObj.batPivot;
      
      // 瞬間高舉往前重砸 (角度突變)
      pivot.rotation.x = -1.4;
      pivot.rotation.z = -0.4;
      
      setTimeout(() => {
        pivot.rotation.x = 0.3;
        pivot.rotation.z = 0;
      }, 200);
    }

    function renderScreen() {
      if (!currentVoting) return;
      const ctx = screenCanvas.getContext('2d');
      ctx.fillStyle = "#0f172a";
      ctx.fillRect(0, 0, 1024, 768);

      ctx.fillStyle = "#38bdf8";
      ctx.font = "bold 42px sans-serif";
      ctx.fillText(`【${currentVoting.mode === 'single' ? '單選' : '多選'}】${currentVoting.question}`, 50, 80);

      const opts = currentVoting.options || [];
      const itemSpacing = Math.min(95, 580 / Math.max(opts.length, 1));

      opts.forEach((opt, idx) => {
        const y = 160 + idx * itemSpacing;
        ctx.fillStyle = "#334155";
        ctx.fillRect(50, y, 924, 48);
        ctx.fillStyle = "#22c55e";
        ctx.fillRect(50, y, Math.min(opt.votes * 140, 924), 48);
        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 28px sans-serif";
        ctx.fillText(`${opt.text} — ${opt.votes} 票`, 70, y + 34);
      });
      screenTexture.needsUpdate = true;
    }

    function initJoystick() {
      const zone = document.getElementById('joystick-zone');
      const knob = document.getElementById('joystick-knob');
      const maxDist = 45;
      let active = false;
      let startX = 0, startY = 0;

      function handleStart(e) {
        active = true;
        const touch = e.touches ? e.touches[0] : e;
        const rect = zone.getBoundingClientRect();
        startX = rect.left + rect.width / 2;
        startY = rect.top + rect.height / 2;
        handleMove(e);
      }

      function handleMove(e) {
        if (!active) return;
        const touch = e.touches ? e.touches[0] : e;
        const dx = touch.clientX - startX;
        const dy = touch.clientY - startY;
        const dist = Math.hypot(dx, dy);
        const angle = Math.atan2(dy, dx);
        const clampedDist = Math.min(dist, maxDist);

        const knobX = Math.cos(angle) * clampedDist;
        const knobY = Math.sin(angle) * clampedDist;

        knob.style.transform = `translate(${knobX}px, ${knobY}px)`;

        joyMoveX = knobX / maxDist;
        joyMoveZ = knobY / maxDist;
      }

      function handleEnd() {
        active = false;
        knob.style.transform = `translate(0px, 0px)`;
        joyMoveX = 0;
        joyMoveZ = 0;
      }

      zone.addEventListener('touchstart', handleStart, { passive: false });
      window.addEventListener('touchmove', handleMove, { passive: false });
      window.addEventListener('touchend', handleEnd);

      zone.addEventListener('mousedown', handleStart);
      window.addEventListener('mousemove', handleMove);
      window.addEventListener('mouseup', handleEnd);
    }

    function initNetwork(name, isHost) {
      socket = io();
      socket.emit('join', { name, isHost });

      socket.on('init', (data) => {
        myId = data.id;
        currentVoting = data.voting;
        renderScreen();

        for (let id in data.players) {
          const p = createPlayerMesh(data.players[id]);
          players[id] = p;
          if (id === myId) myPlayer = p;
        }
      });

      socket.on('playerJoined', (data) => {
        if (!players[data.id]) players[data.id] = createPlayerMesh(data);
      });

      socket.on('playerMoved', (data) => {
        if (players[data.id]) {
          players[data.id].targetPos.set(data.x, 0, data.z);
        }
      });

      socket.on('playerLeft', (id) => {
        if (players[id]) {
          scene.remove(players[id].group);
          delete players[id];
        }
      });

      socket.on('playerClapped', ({ id }) => {
        const p = players[id];
        if (!p) return;
        let t = 0;
        const clapInterval = setInterval(() => {
          t++;
          p.leftHand.position.x = -0.65 + (t % 2 === 0 ? 0.35 : 0);
          p.rightHand.position.x = 0.65 - (t % 2 === 0 ? 0.35 : 0);
          p.group.position.y = (t % 2 === 0 ? 0.35 : 0);
          if (t > 6) {
            clearInterval(clapInterval);
            p.leftHand.position.x = -0.65;
            p.rightHand.position.x = 0.65;
            p.group.position.y = 0;
          }
        }, 80);
      });

      // 他人揮棒動畫
      socket.on('playerAttackSwing', ({ id }) => {
        playSwingAnimation(players[id]);
      });

      socket.on('playerHit', ({ targetId, knockbackX, knockbackZ }) => {
        const p = players[targetId];
        if (!p) return;

        p.body.material.color.setHex(0xff1111);
        p.group.scale.set(1.3, 0.7, 1.3);

        p.targetPos.x += knockbackX;
        p.targetPos.z += knockbackZ;
        if (targetId === myId) {
          p.group.position.x += knockbackX;
          p.group.position.z += knockbackZ;
          socket.emit('move', { x: p.group.position.x, z: p.group.position.z });
        }

        setTimeout(() => {
          p.body.material.color.setHex(p.origColor);
          p.group.scale.set(1, 1, 1);
        }, 220);
      });

      socket.on('voteUpdated', (v) => {
        currentVoting = v;
        renderScreen();
      });

      socket.on('voteSuccess', () => {
        alert('🎉 投票成功！黑板已更新。');
      });
    }

    function handleKey(e) {
      if (!myPlayer) return;
      const speed = 0.6;
      if (e.key === 'w' || e.key === 'ArrowUp') myPlayer.group.position.z -= speed;
      if (e.key === 's' || e.key === 'ArrowDown') myPlayer.group.position.z += speed;
      if (e.key === 'a' || e.key === 'ArrowLeft') myPlayer.group.position.x -= speed;
      if (e.key === 'd' || e.key === 'ArrowRight') myPlayer.group.position.x += speed;
      socket.emit('move', { x: myPlayer.group.position.x, z: myPlayer.group.position.z });
    }

    function triggerClap() {
      socket.emit('clap');
    }

    function triggerPunch() {
      if (!myPlayer) return;
      
      // 本地優先直接揮棒，不等網路廣播
      playSwingAnimation(myPlayer);
      socket.emit('swing');

      let closestId = null, minDist = 2.8;
      for (let id in players) {
        if (id === myId) continue;
        const dist = myPlayer.group.position.distanceTo(players[id].group.position);
        if (dist < minDist) {
          minDist = dist;
          closestId = id;
        }
      }

      if (closestId) {
        const dx = players[closestId].group.position.x - myPlayer.group.position.x;
        const dz = players[closestId].group.position.z - myPlayer.group.position.z;
        const len = Math.hypot(dx, dz) || 1;
        const knockbackX = (dx / len) * 2.5;
        const knockbackZ = (dz / len) * 2.5;
        socket.emit('punch', { targetId: closestId, knockbackX, knockbackZ });
      }
    }

    function openVoteModal() {
      const modal = document.getElementById('modal');
      const content = document.getElementById('modal-content');
      modal.style.display = 'block';

      if (isHost) {
        content.innerHTML = `
          <h3>⚙️ 主持人管理後台</h3>
          題目：<br>
          <input id="v-q" value="${currentVoting.question}" style="width:100%; padding:8px; margin:6px 0; border:1px solid #cbd5e1; border-radius:6px;"><br><br>
          模式：
          <select id="v-mode" style="padding:6px; border-radius:6px;">
            <option value="single" ${currentVoting.mode === 'single' ? 'selected' : ''}>單選投票</option>
            <option value="multiple" ${currentVoting.mode === 'multiple' ? 'selected' : ''}>多選投票</option>
          </select><br><br>
          選項（用半形逗號 , 分隔）：<br>
          <input id="v-opts" value="${currentVoting.options.map(o => o.text).join(',')}" style="width:100%; padding:8px; margin:6px 0; border:1px solid #cbd5e1; border-radius:6px;"><br><br>
          <button class="btn-vote" style="width:100%;" onclick="submitHostSettings()">更新大黑板投票</button>
        `;
      } else {
        const isSingle = currentVoting.mode === 'single';
        const type = isSingle ? 'radio' : 'checkbox';
        content.innerHTML = `
          <h3>${currentVoting.question}</h3>
          <p style="color:#64748b; font-size:14px;">（${isSingle ? '單選' : '可複選多項'}）</p>
          ${currentVoting.options.map(o => `
            <label style="display:block; margin:12px 0; font-size:16px; cursor:pointer;">
              <input type="${type}" name="vote-opt" value="${o.id}"> <b>${o.text}</b>
            </label>
          `).join('')}
          <br>
          <button class="btn-vote" style="width:100%;" onclick="submitUserVote()">送出選票</button>
        `;
      }
    }

    function submitHostSettings() {
      const q = document.getElementById('v-q').value.trim() || '投票';
      const mode = document.getElementById('v-mode').value;
      const opts = document.getElementById('v-opts').value.split(',').map(s => s.trim()).filter(Boolean);
      socket.emit('hostSetVote', { question: q, mode, options: opts });
      closeModal();
    }

    function submitUserVote() {
      const checkedBoxes = Array.from(document.querySelectorAll('input[name="vote-opt"]:checked'));
      if (checkedBoxes.length === 0) {
        alert('請先勾選選項後再送出！');
        return;
      }
      const selectedIds = checkedBoxes.map(i => parseInt(i.value, 10));
      socket.emit('castVote', selectedIds);
      closeModal();
    }

    function closeModal() {
      document.getElementById('modal').style.display = 'none';
    }

    function animate() {
      requestAnimationFrame(animate);

      if (myPlayer && (joyMoveX !== 0 || joyMoveZ !== 0)) {
        const speed = 0.18;
        myPlayer.group.position.x += joyMoveX * speed;
        myPlayer.group.position.z += joyMoveZ * speed;
        socket.emit('move', { x: myPlayer.group.position.x, z: myPlayer.group.position.z });
      }

      for (let id in players) {
        if (id !== myId) {
          players[id].group.position.lerp(players[id].targetPos, 0.2);
        }
      }

      renderer.render(scene, camera);
    }
  </script>
</body>
</html>
