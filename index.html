<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>辦公室 3D 摔角競技場投票</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    
    /* 鎖定手機視窗：禁止雙指縮放與拖曳彈性滑動 */
    html, body {
      position: fixed;
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #090d16;
    }

    /* 右上角操作指引 */
    #help-panel {
      position: absolute;
      top: 15px;
      right: 15px;
      background: rgba(15, 23, 42, 0.85);
      color: #f8fafc;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 12px;
      line-height: 1.5;
      z-index: 20;
      backdrop-filter: blur(5px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      pointer-events: none;
    }
    #help-panel b { color: #38bdf8; }

    /* 手機左下角虛擬搖桿 */
    #joystick-zone {
      position: absolute;
      bottom: 25px;
      left: 25px;
      width: 110px;
      height: 110px;
      background: rgba(255, 255, 255, 0.2);
      border: 2px solid rgba(255, 255, 255, 0.4);
      border-radius: 50%;
      z-index: 15;
    }
    #joystick-knob {
      position: absolute;
      top: 30px;
      left: 30px;
      width: 50px;
      height: 50px;
      background: rgba(255, 255, 255, 0.85);
      border-radius: 50%;
      pointer-events: none;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }

    /* 底部中間：聊天輸入列 */
    #chat-bar {
      position: absolute;
      bottom: 25px;
      left: 150px;
      display: flex;
      gap: 6px;
      z-index: 15;
    }
    #chat-input {
      padding: 8px 12px;
      font-size: 16px; /* 防止 iOS 自動縮放 */
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.5);
      background: rgba(255, 255, 255, 0.95);
      width: 140px;
      outline: none;
    }
    #chat-send-btn {
      padding: 8px 14px;
      font-size: 14px;
      font-weight: bold;
      border-radius: 20px;
      border: none;
      background: #0284c7;
      color: white;
      cursor: pointer;
    }

    /* 右側動作按鈕 */
    #ui-overlay {
      position: absolute;
      bottom: 25px;
      right: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      z-index: 15;
    }
    @media (min-width: 820px) {
      #chat-bar { left: 50%; transform: translateX(-50%); bottom: 90px; }
      #chat-input { width: 260px; }
      #ui-overlay {
        flex-direction: row;
        right: auto;
        left: 50%;
        transform: translateX(-50%);
      }
    }

    button {
      padding: 11px 18px;
      font-size: 15px;
      font-weight: bold;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      box-shadow: 0 4px 8px rgba(0,0,0,0.25);
    }
    button:active { transform: scale(0.94); }
    .btn-clap { background: #eab308; color: white; }
    .btn-punch { background: #ef4444; color: white; }
    .btn-vote { background: #3b82f6; color: white; }

    /* 彈窗 UI */
    #modal {
      display: none;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: white;
      padding: 22px;
      border-radius: 16px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.4);
      z-index: 25;
      width: 85%;
      max-width: 360px;
      max-height: 80vh;
      overflow-y: auto;
    }
    #login-modal {
      position: absolute;
      inset: 0;
      background: rgba(10, 15, 29, 0.9);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 30;
    }
    .login-box {
      background: white;
      padding: 26px;
      border-radius: 16px;
      text-align: center;
      width: 80%;
      max-width: 300px;
    }
    .close-btn { background: #64748b; color: white; margin-top: 15px; width: 100%; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="/socket.io/socket.io.js"></script>
</head>
<body>

  <!-- 登入介面 -->
  <div id="login-modal">
    <div class="login-box">
      <h2>🏆 3D 擂台投票</h2>
      <input type="text" id="username" placeholder="輸入同事暱稱" style="padding:10px; width:100%; font-size:16px; margin-bottom:15px; border:1px solid #cbd5e1; border-radius:8px;"><br>
      <label style="font-size:15px; cursor:pointer;"><input type="checkbox" id="isHost"> 我是主持人</label><br><br>
      <button class="btn-vote" style="width:100%;" onclick="startGame()">進入競技場</button>
    </div>
  </div>

  <!-- 右上角說明面板 -->
  <div id="help-panel">
    <b>💻 電腦按鍵</b><br>
    移動：<code>WASD</code> / 方向鍵<br>
    揮棒：<code>Space</code> (空白鍵)<br>
    鼓掌：<code>C</code> 鍵<br>
    聊天：<code>Enter</code> 輸入<br>
    <hr style="border:0; border-top:1px solid rgba(255,255,255,0.2); margin:5px 0;">
    <b>📱 手機操作</b><br>
    左下搖桿滑動、右鍵揍人
  </div>

  <!-- 虛擬搖桿 -->
  <div id="joystick-zone">
    <div id="joystick-knob"></div>
  </div>

  <!-- 聊天輸入列 -->
  <div id="chat-bar">
    <input type="text" id="chat-input" placeholder="說點什麼..." maxlength="30">
    <button id="chat-send-btn" onclick="sendChat()">傳送</button>
  </div>

  <!-- 下方按鈕群 -->
  <div id="ui-overlay">
    <button class="btn-clap" onclick="triggerClap()">👏 鼓掌</button>
    <button class="btn-punch" onclick="triggerPunch()">🏏 揮棒揍人</button>
    <button class="btn-vote" onclick="openVoteModal()">🗳️ 投票 / 設定</button>
  </div>

  <!-- 彈窗 -->
  <div id="modal">
    <div id="modal-content"></div>
    <button class="close-btn" onclick="closeModal()">關閉</button>
  </div>

  <script>
    // 嚴格阻擋手機手勢放大縮小
    document.addEventListener('gesturestart', (e) => e.preventDefault());
    document.addEventListener('gesturechange', (e) => e.preventDefault());
    document.addEventListener('gestureend', (e) => e.preventDefault());
    document.addEventListener('touchmove', (e) => {
      if (e.target.tagName !== 'INPUT' && !e.target.closest('#modal')) {
        e.preventDefault();
      }
    }, { passive: false });

    let socket, scene, camera, renderer;
    let myId, myPlayer;
    let players = {};
    let isHost = false;
    let currentVoting = null;
    let screenCanvas, screenTexture;

    let joyMoveX = 0;
    let joyMoveZ = 0;
    let crowdFlashes = []; // 觀眾相機閃光燈陣列

    // 擂台邊界
    const BOUNDS = { minX: -12, maxX: 12, minZ: -5.5, maxZ: 11.5 };

    function startGame() {
      const name = document.getElementById('username').value.trim() || '同事';
      isHost = document.getElementById('isHost').checked;
      document.getElementById('login-modal').style.display = 'none';

      init3D();
      initJoystick();
      initNetwork(name, isHost);
    }

    function init3D() {
      scene = new THREE.Scene();
      // 競技場夜間氛圍深色背景
      scene.background = new THREE.Color(0x0a0f1d);

      camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 13, 19);
      camera.lookAt(0, 2, 0);

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      document.body.appendChild(renderer.domElement);

      // 競技場聚光燈照明
      const spotLight = new THREE.DirectionalLight(0xffffff, 1.1);
      spotLight.position.set(10, 26, 12);
      scene.add(spotLight);
      scene.add(new THREE.AmbientLight(0x556677));

      // 擂台擂台地墊
      const ringMat = new THREE.Mesh(new THREE.PlaneGeometry(25, 18), new THREE.MeshLambertMaterial({ color: 0x1e293b }));
      ringMat.rotation.x = -Math.PI / 2;
      ringMat.position.set(0, 0.02, 3);
      scene.add(ringMat);

      // 擂台外圍地面
      const floor = new THREE.Mesh(new THREE.PlaneGeometry(55, 55), new THREE.MeshLambertMaterial({ color: 0x0f172a }));
      floor.rotation.x = -Math.PI / 2;
      scene.add(floor);

      // 建造摔角繩
      buildWrestlingRing();

      // 建造人山人海觀眾看台
      buildCrowdAudience();

      // 中心圓桌
      const table = new THREE.Mesh(new THREE.CylinderGeometry(2.2, 2.2, 0.8, 32), new THREE.MeshLambertMaterial({ color: 0x475569 }));
      table.position.set(0, 0.4, 0);
      scene.add(table);

      // 大黑板
      screenCanvas = document.createElement('canvas');
      screenCanvas.width = 1024;
      screenCanvas.height = 768;
      screenTexture = new THREE.CanvasTexture(screenCanvas);
      const screenMesh = new THREE.Mesh(new THREE.PlaneGeometry(14, 7.5), new THREE.MeshBasicMaterial({ map: screenTexture }));
      screenMesh.position.set(0, 7.5, -9);
      scene.add(screenMesh);

      window.addEventListener('keydown', handleKey);
      window.addEventListener('resize', onWindowResize);

      animate();
    }

    // 建造人山人海觀眾席看台
    function buildCrowdAudience() {
      const loader = new THREE.TextureLoader();
      loader.setCrossOrigin('anonymous');
      // 免費高畫質大型場館沸騰觀眾海
      const crowdImgUrl = "https://images.unsplash.com/photo-1540039155733-5bb30b53aa14?auto=format&fit=crop&w=1600&q=80";

      loader.load(crowdImgUrl, (texture) => {
        texture.wrapS = THREE.RepeatWrapping;
        texture.wrapT = THREE.ClampToEdgeWrapping;

        // 1. 後方巨型看台 (在黑板正後方升起)
        const backTex = texture.clone();
        backTex.repeat.set(2.5, 1);
        backTex.needsUpdate = true;
        const backStand = new THREE.Mesh(
          new THREE.PlaneGeometry(50, 18),
          new THREE.MeshBasicMaterial({ map: backTex, side: THREE.DoubleSide })
        );
        backStand.position.set(0, 9, -14);
        backStand.rotation.x = 0.18; // 微向後傾斜如階梯
        scene.add(backStand);

        // 2. 左側巨型看台
        const leftTex = texture.clone();
        leftTex.repeat.set(1.8, 1);
        leftTex.needsUpdate = true;
        const leftStand = new THREE.Mesh(
          new THREE.PlaneGeometry(36, 18),
          new THREE.MeshBasicMaterial({ map: leftTex, side: THREE.DoubleSide })
        );
        leftStand.position.set(-17.5, 9, 3);
        leftStand.rotation.y = Math.PI / 2;
        leftStand.rotation.z = -0.18;
        scene.add(leftStand);

        // 3. 右側巨型看台
        const rightTex = texture.clone();
        rightTex.repeat.set(1.8, 1);
        rightTex.needsUpdate = true;
        const rightStand = new THREE.Mesh(
          new THREE.PlaneGeometry(36, 18),
          new THREE.MeshBasicMaterial({ map: rightTex, side: THREE.DoubleSide })
        );
        rightStand.position.set(17.5, 9, 3);
        rightStand.rotation.y = -Math.PI / 2;
        rightStand.rotation.z = 0.18;
        scene.add(rightStand);

        // 生成觀眾席相機閃光燈粒子
        initCrowdFlashes();
      });
    }

    // 觀眾席閃光燈系統
    function initCrowdFlashes() {
      const flashGeo = new THREE.PlaneGeometry(0.7, 0.7);
      for (let i = 0; i < 20; i++) {
        const flashMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0 });
        const mesh = new THREE.Mesh(flashGeo, flashMat);
        
        // 隨機分佈在三面看台上
        const side = Math.floor(Math.random() * 3);
        if (side === 0) { // 後看台
          mesh.position.set((Math.random() - 0.5) * 44, 3 + Math.random() * 12, -13.5);
        } else if (side === 1) { // 左看台
          mesh.position.set(-17, 3 + Math.random() * 12, (Math.random() - 0.5) * 30 + 3);
        } else { // 右看台
          mesh.position.set(17, 3 + Math.random() * 12, (Math.random() - 0.5) * 30 + 3);
        }

        scene.add(mesh);
        crowdFlashes.push({
          mesh,
          timer: Math.floor(Math.random() * 80)
        });
      }
    }

    // 建造四角鐵柱與三道高彈性摔角繩
    function buildWrestlingRing() {
      const { minX, maxX, minZ, maxZ } = BOUNDS;
      const corners = [
        [minX, minZ], [maxX, minZ],
        [maxX, maxZ], [minX, maxZ]
      ];

      const postMat = new THREE.MeshLambertMaterial({ color: 0x334155 });
      const postGeo = new THREE.CylinderGeometry(0.2, 0.2, 2.5);

      corners.forEach(([x, z]) => {
        const post = new THREE.Mesh(postGeo, postMat);
        post.position.set(x, 1.25, z);
        scene.add(post);
      });

      const ropeColors = [0xef4444, 0xffffff, 0x3b82f6];
      const ropeHeights = [0.6, 1.2, 1.8];

      ropeHeights.forEach((h, idx) => {
        const ropeMat = new THREE.MeshBasicMaterial({ color: ropeColors[idx] });
        
        const ropeZGeo = new THREE.CylinderGeometry(0.04, 0.04, maxX - minX);
        const ropeTop = new THREE.Mesh(ropeZGeo, ropeMat);
        ropeTop.rotation.z = Math.PI / 2;
        ropeTop.position.set((minX + maxX) / 2, h, minZ);
        scene.add(ropeTop);

        const ropeBottom = new THREE.Mesh(ropeZGeo, ropeMat);
        ropeBottom.rotation.z = Math.PI / 2;
        ropeBottom.position.set((minX + maxX) / 2, h, maxZ);
        scene.add(ropeBottom);

        const ropeXGeo = new THREE.CylinderGeometry(0.04, 0.04, maxZ - minZ);
        const ropeLeft = new THREE.Mesh(ropeXGeo, ropeMat);
        ropeLeft.rotation.x = Math.PI / 2;
        ropeLeft.position.set(minX, h, (minZ + maxZ) / 2);
        scene.add(ropeLeft);

        const ropeRight = new THREE.Mesh(ropeXGeo, ropeMat);
        ropeRight.rotation.x = Math.PI / 2;
        ropeRight.position.set(maxX, h, (minZ + maxZ) / 2);
        scene.add(ropeRight);
      });
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function createNameSprite(name) {
      const canvas = document.createElement('canvas');
      canvas.width = 256; canvas.height = 64;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = "rgba(0, 0, 0, 0.75)";
      ctx.roundRect ? ctx.roundRect(8, 8, 240, 48, 12) : ctx.fillRect(8, 8, 240, 48);
      ctx.fill();
      ctx.fillStyle = "#ffffff";
      ctx.font = "bold 26px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText(name, 128, 41);

      const texture = new THREE.CanvasTexture(canvas);
      const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: texture }));
      sprite.position.set(0, 2.5, 0);
      sprite.scale.set(3.2, 0.8, 1);
      return sprite;
    }

    function createChatSprite() {
      const canvas = document.createElement('canvas');
      canvas.width = 384; canvas.height = 128;
      const texture = new THREE.CanvasTexture(canvas);
      const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: texture, transparent: true }));
      sprite.position.set(0, 3.6, 0);
      sprite.scale.set(4.2, 1.4, 1);
      sprite.visible = false;
      return { sprite, canvas, texture };
    }

    function showChatBubble(playerObj, text) {
      if (!playerObj || !playerObj.chatObj) return;
      const { canvas, texture, sprite } = playerObj.chatObj;
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, 384, 128);

      ctx.fillStyle = "#ffffff";
      ctx.beginPath();
      ctx.roundRect ? ctx.roundRect(10, 10, 364, 85, 14) : ctx.fillRect(10, 10, 364, 85);
      ctx.fill();

      ctx.beginPath();
      ctx.moveTo(180, 95); ctx.lineTo(192, 115); ctx.lineTo(204, 95);
      ctx.fill();

      ctx.strokeStyle = "#94a3b8";
      ctx.lineWidth = 3;
      ctx.stroke();

      ctx.fillStyle = "#0f172a";
      ctx.font = "bold 28px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText(text.length > 14 ? text.slice(0, 13) + '...' : text, 192, 60);

      texture.needsUpdate = true;
      sprite.visible = true;

      if (playerObj.chatTimer) clearTimeout(playerObj.chatTimer);
      playerObj.chatTimer = setTimeout(() => {
        sprite.visible = false;
      }, 10000);
    }

    function createPlayerMesh(p) {
      const group = new THREE.Group();

      const bodyMat = new THREE.MeshLambertMaterial({ color: p.color });
      const body = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.5, 1.4, 16), bodyMat);
      body.position.y = 0.7;
      group.add(body);

      const handGeo = new THREE.SphereGeometry(0.18, 12, 12);
      const leftHand = new THREE.Mesh(handGeo, bodyMat);
      leftHand.position.set(-0.65, 0.7, 0);
      const rightHand = new THREE.Mesh(handGeo, bodyMat);
      rightHand.position.set(0.65, 0.7, 0);
      group.add(leftHand);
      group.add(rightHand);

      const batPivot = new THREE.Group();
      batPivot.position.set(0.65, 0.7, 0);
      const handle = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 0.4), new THREE.MeshLambertMaterial({ color: 0xef4444 }));
      handle.position.y = 0.2;
      const batHead = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.15, 0.8, 12), new THREE.MeshLambertMaterial({ color: 0xfacc15 }));
      batHead.position.y = 0.7;
      batPivot.add(handle);
      batPivot.add(batHead);
      batPivot.rotation.x = 0.3;
      group.add(batPivot);

      const nameSprite = createNameSprite(p.name);
      group.add(nameSprite);

      const chatObj = createChatSprite();
      group.add(chatObj.sprite);

      group.position.set(p.x, 0, p.z);
      scene.add(group);

      return {
        group, body, leftHand, rightHand, batPivot, chatObj,
        origColor: p.color,
        name: p.name,
        targetPos: new THREE.Vector3(p.x, 0, p.z)
      };
    }

    function playSwingAnimation(playerObj) {
      if (!playerObj || !playerObj.batPivot) return;
      const pivot = playerObj.batPivot;
      pivot.rotation.x = -1.4;
      pivot.rotation.z = -0.4;
      setTimeout(() => {
        pivot.rotation.x = 0.3;
        pivot.rotation.z = 0;
      }, 200);
    }

    function renderScreen() {
      if (!currentVoting) return;
      const ctx = screenCanvas.getContext('2d');
      ctx.fillStyle = "#0f172a";
      ctx.fillRect(0, 0, 1024, 768);

      ctx.fillStyle = "#38bdf8";
      ctx.font = "bold 42px sans-serif";
      ctx.fillText(`【${currentVoting.mode === 'single' ? '單選' : '多選'}】${currentVoting.question}`, 50, 80);

      const opts = currentVoting.options || [];
      const itemSpacing = Math.min(95, 580 / Math.max(opts.length, 1));

      opts.forEach((opt, idx) => {
        const y = 160 + idx * itemSpacing;
        ctx.fillStyle = "#334155";
        ctx.fillRect(50, y, 924, 48);
        ctx.fillStyle = "#22c55e";
        ctx.fillRect(50, y, Math.min(opt.votes * 140, 924), 48);
        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 28px sans-serif";
        ctx.fillText(`${opt.text} — ${opt.votes} 票`, 70, y + 34);
      });
      screenTexture.needsUpdate = true;
    }

    function initJoystick() {
      const zone = document.getElementById('joystick-zone');
      const knob = document.getElementById('joystick-knob');
      const maxDist = 45;
      let active = false;
      let startX = 0, startY = 0;

      function handleStart(e) {
        active = true;
        const touch = e.touches ? e.touches[0] : e;
        const rect = zone.getBoundingClientRect();
        startX = rect.left + rect.width / 2;
        startY = rect.top + rect.height / 2;
        handleMove(e);
      }

      function handleMove(e) {
        if (!active) return;
        const touch = e.touches ? e.touches[0] : e;
        const dx = touch.clientX - startX;
        const dy = touch.clientY - startY;
        const dist = Math.hypot(dx, dy);
        const angle = Math.atan2(dy, dx);
        const clampedDist = Math.min(dist, maxDist);

        const knobX = Math.cos(angle) * clampedDist;
        const knobY = Math.sin(angle) * clampedDist;

        knob.style.transform = `translate(${knobX}px, ${knobY}px)`;
        joyMoveX = knobX / maxDist;
        joyMoveZ = knobY / maxDist;
      }

      function handleEnd() {
        active = false;
        knob.style.transform = `translate(0px, 0px)`;
        joyMoveX = 0;
        joyMoveZ = 0;
      }

      zone.addEventListener('touchstart', handleStart, { passive: false });
      window.addEventListener('touchmove', handleMove, { passive: false });
      window.addEventListener('touchend', handleEnd);

      zone.addEventListener('mousedown', handleStart);
      window.addEventListener('mousemove', handleMove);
      window.addEventListener('mouseup', handleEnd);
    }

    function initNetwork(name, isHost) {
      socket = io();
      socket.emit('join', { name, isHost });

      socket.on('init', (data) => {
        myId = data.id;
        currentVoting = data.voting;
        renderScreen();

        for (let id in data.players) {
          const p = createPlayerMesh(data.players[id]);
          players[id] = p;
          if (id === myId) myPlayer = p;
        }
      });

      socket.on('playerJoined', (data) => {
        if (!players[data.id]) players[data.id] = createPlayerMesh(data);
      });

      socket.on('playerMoved', (data) => {
        if (players[data.id]) {
          players[data.id].targetPos.set(data.x, 0, data.z);
        }
      });

      socket.on('playerLeft', (id) => {
        if (players[id]) {
          scene.remove(players[id].group);
          delete players[id];
        }
      });

      socket.on('playerClapped', ({ id }) => {
        const p = players[id];
        if (!p) return;
        let t = 0;
        const clapInterval = setInterval(() => {
          t++;
          p.leftHand.position.x = -0.65 + (t % 2 === 0 ? 0.35 : 0);
          p.rightHand.position.x = 0.65 - (t % 2 === 0 ? 0.35 : 0);
          p.group.position.y = (t % 2 === 0 ? 0.35 : 0);
          if (t > 6) {
            clearInterval(clapInterval);
            p.leftHand.position.x = -0.65;
            p.rightHand.position.x = 0.65;
            p.group.position.y = 0;
          }
        }, 80);
      });

      socket.on('playerAttackSwing', ({ id }) => {
        playSwingAnimation(players[id]);
      });

      socket.on('playerHit', ({ targetId, knockbackX, knockbackZ }) => {
        const p = players[targetId];
        if (!p) return;

        p.body.material.color.setHex(0xff1111);
        p.group.scale.set(1.3, 0.7, 1.3);

        p.targetPos.x += knockbackX;
        p.targetPos.z += knockbackZ;
        if (targetId === myId) {
          p.group.position.x += knockbackX;
          p.group.position.z += knockbackZ;
          checkBoundsAndBounce(p.group.position);
          socket.emit('move', { x: p.group.position.x, z: p.group.position.z });
        }

        setTimeout(() => {
          p.body.material.color.setHex(p.origColor);
          p.group.scale.set(1, 1, 1);
        }, 220);
      });

      socket.on('playerChat', ({ id, text }) => {
        showChatBubble(players[id], text);
      });

      socket.on('voteUpdated', (v) => {
        currentVoting = v;
        renderScreen();
      });

      socket.on('voteSuccess', () => {
        alert('🎉 投票成功！黑板已更新。');
      });
    }

    function checkBoundsAndBounce(pos) {
      let bounced = false;
      const bounceForce = 1.2;

      if (pos.x > BOUNDS.maxX) { pos.x = BOUNDS.maxX - 0.2; pos.x -= bounceForce; bounced = true; }
      if (pos.x < BOUNDS.minX) { pos.x = BOUNDS.minX + 0.2; pos.x += bounceForce; bounced = true; }
      if (pos.z > BOUNDS.maxZ) { pos.z = BOUNDS.maxZ - 0.2; pos.z -= bounceForce; bounced = true; }
      if (pos.z < BOUNDS.minZ) { pos.z = BOUNDS.minZ + 0.2; pos.z += bounceForce; bounced = true; }

      if (bounced && myPlayer) {
        myPlayer.group.scale.set(0.9, 1.2, 0.9);
        setTimeout(() => myPlayer.group.scale.set(1, 1, 1), 150);
      }
    }

    function handleKey(e) {
      if (!myPlayer) return;
      if (document.activeElement.tagName === 'INPUT') {
        if (e.key === 'Enter') sendChat();
        return;
      }

      const speed = 0.6;
      let moved = false;
      if (e.key === 'w' || e.key === 'ArrowUp') { myPlayer.group.position.z -= speed; moved = true; }
      if (e.key === 's' || e.key === 'ArrowDown') { myPlayer.group.position.z += speed; moved = true; }
      if (e.key === 'a' || e.key === 'ArrowLeft') { myPlayer.group.position.x -= speed; moved = true; }
      if (e.key === 'd' || e.key === 'ArrowRight') { myPlayer.group.position.x += speed; moved = true; }

      if (e.code === 'Space') { e.preventDefault(); triggerPunch(); }
      if (e.key === 'c' || e.key === 'C') triggerClap();
      if (e.key === 'Enter') document.getElementById('chat-input').focus();

      if (moved) {
        checkBoundsAndBounce(myPlayer.group.position);
        socket.emit('move', { x: myPlayer.group.position.x, z: myPlayer.group.position.z });
      }
    }

    function triggerClap() { socket.emit('clap'); }

    function triggerPunch() {
      if (!myPlayer) return;
      playSwingAnimation(myPlayer);
      socket.emit('swing');

      let closestId = null, minDist = 2.8;
      for (let id in players) {
        if (id === myId) continue;
        const dist = myPlayer.group.position.distanceTo(players[id].group.position);
        if (dist < minDist) {
          minDist = dist;
          closestId = id;
        }
      }

      if (closestId) {
        const dx = players[closestId].group.position.x - myPlayer.group.position.x;
        const dz = players[closestId].group.position.z - myPlayer.group.position.z;
        const len = Math.hypot(dx, dz) || 1;
        const knockbackX = (dx / len) * 2.5;
        const knockbackZ = (dz / len) * 2.5;
        socket.emit('punch', { targetId: closestId, knockbackX, knockbackZ });
      }
    }

    function sendChat() {
      const input = document.getElementById('chat-input');
      const text = input.value.trim();
      if (!text) return;
      socket.emit('chat', text);
      input.value = '';
      input.blur();
    }

    function openVoteModal() {
      const modal = document.getElementById('modal');
      const content = document.getElementById('modal-content');
      modal.style.display = 'block';

      if (isHost) {
        content.innerHTML = `
          <h3>⚙️ 主持人管理後台</h3>
          題目：<br>
          <input id="v-q" value="${currentVoting.question}" style="width:100%; padding:8px; margin:6px 0; border:1px solid #cbd5e1; border-radius:6px; font-size:16px;"><br><br>
          模式：
          <select id="v-mode" style="padding:6px; border-radius:6px; font-size:16px;">
            <option value="single" ${currentVoting.mode === 'single' ? 'selected' : ''}>單選投票</option>
            <option value="multiple" ${currentVoting.mode === 'multiple' ? 'selected' : ''}>多選投票</option>
          </select><br><br>
          選項（逗號分隔）：<br>
          <input id="v-opts" value="${currentVoting.options.map(o => o.text).join(',')}" style="width:100%; padding:8px; margin:6px 0; border:1px solid #cbd5e1; border-radius:6px; font-size:16px;"><br><br>
          <button class="btn-vote" style="width:100%;" onclick="submitHostSettings()">更新大黑板投票</button>
        `;
      } else {
        const isSingle = currentVoting.mode === 'single';
        const type = isSingle ? 'radio' : 'checkbox';
        content.innerHTML = `
          <h3>${currentVoting.question}</h3>
          <p style="color:#64748b; font-size:14px;">（${isSingle ? '單選' : '可複選多項'}）</p>
          ${currentVoting.options.map(o => `
            <label style="display:block; margin:12px 0; font-size:16px; cursor:pointer;">
              <input type="${type}" name="vote-opt" value="${o.id}"> <b>${o.text}</b>
            </label>
          `).join('')}
          <br>
          <button class="btn-vote" style="width:100%;" onclick="submitUserVote()">送出選票</button>
        `;
      }
    }

    function submitHostSettings() {
      const q = document.getElementById('v-q').value.trim() || '投票';
      const mode = document.getElementById('v-mode').value;
      const opts = document.getElementById('v-opts').value.split(',').map(s => s.trim()).filter(Boolean);
      socket.emit('hostSetVote', { question: q, mode, options: opts });
      closeModal();
    }

    function submitUserVote() {
      const checkedBoxes = Array.from(document.querySelectorAll('input[name="vote-opt"]:checked'));
      if (checkedBoxes.length === 0) {
        alert('請先勾選選項後再送出！');
        return;
      }
      const selectedIds = checkedBoxes.map(i => parseInt(i.value, 10));
      socket.emit('castVote', selectedIds);
      closeModal();
    }

    function closeModal() { document.getElementById('modal').style.display = 'none'; }

    function animate() {
      requestAnimationFrame(animate);

      // 手機搖桿移動
      if (myPlayer && (joyMoveX !== 0 || joyMoveZ !== 0)) {
        const speed = 0.18;
        myPlayer.group.position.x += joyMoveX * speed;
        myPlayer.group.position.z += joyMoveZ * speed;
        checkBoundsAndBounce(myPlayer.group.position);
        socket.emit('move', { x: myPlayer.group.position.x, z: myPlayer.group.position.z });
      }

      // 其他玩家位置 Lerp 平滑插值
      for (let id in players) {
        if (id !== myId) {
          players[id].group.position.lerp(players[id].targetPos, 0.2);
        }
      }

      // 觀眾席相機閃光燈動畫循環
      crowdFlashes.forEach(f => {
        f.timer--;
        if (f.timer <= 0) {
          f.mesh.material.opacity = 1.0;
          f.timer = 50 + Math.floor(Math.random() * 100);
        } else if (f.mesh.material.opacity > 0) {
          f.mesh.material.opacity -= 0.12;
        }
        f.mesh.lookAt(camera.position);
      });

      renderer.render(scene, camera);
    }
  </script>
</body>
</html>
